name: VHDL tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ghdl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GHDL
        run: sudo apt-get update && sudo apt-get install -y ghdl
      - name: Run exhaustive adder test
        run: sh scripts/test.sh
